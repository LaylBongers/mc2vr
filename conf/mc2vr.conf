# mc2vr carrier configuration — read when the game starts; restart to apply.
# launch.sh deploys this to <GAME_DIR>/mc2vr/mc2vr.conf once and never
# overwrites it; edit the deployed copy.
#
# The VR pipeline has no switches: it is active whenever the game's OpenXR
# session runs and the HMD is in use, and passes through (unmodded rendering)
# otherwise. Unknown keys are logged and ignored.

# Render size while the HMD is in use (docs/render_resolution.md).
#   hmd — the runtime's recommended per-eye resolution (default).
#   WxH — an explicit per-eye resolution, e.g. 2016x2240.
#   off — render at the game's window resolution.
# The window keeps the game's own resolution; the monitor shows the left eye.
# render_size=off

# HUD layer (docs/hud.md): with the headset in use, the HUD is laid out and
# drawn once at 1920x1080 (16:9) and shown as a head-locked panel. Its distance in metres (default 1.5) and its
# width in degrees (default 55).
# hud_distance=1.5
# hud_size=55
# World markers (vehicle entry, pickups, objectives) are placed per eye at
# their real depth; their height in degrees (default 3).
# marker_size=3

# Scene MSAA (docs/msaa.md): samples per pixel for the 3D scene and the
# composite — off, 2, 4 (default) or 8. Each step up costs GPU time; at full
# HMD size 8x pushes the game below 90 Hz. Lower it if frames drop. The game's
# own MSAA option has no effect (a bug in the PC port) and is ignored.
# msaa=4

# Sun-shadow cascade fit (docs/shadows.md): stable (default) keeps the shadow
# map's texel grid fixed in the world, so edges don't crawl with head motion;
# stock is the original fit, for A/B. "shadowfit:" lines in the log.
# shadow_fit=stable

# First-person on foot (docs/first_person.md, increment 1): the on-foot camera
# sits at the character's eyes instead of behind it; rotation, look input and
# aim stay the game's, and the headset still turns and moves the view on top.
# Vehicles keep their cameras.
# first_person=on
# Eye height above the character's feet in metres (default 1.65), and how far
# ahead of the head centre the eye sits, along the view (default 0.15).
# first_person_eye_height=1.65
# first_person_eye_forward=0.15

# Game units per metre for head movement (default 1.0; the game uses metres).
# view_world_scale=1.0

# ===========================================================================
# Debug / diagnostics — all off by default. They observe, log and dump; none
# changes what is rendered unless stated. Logs: <GAME_DIR>/mc2vr/mc2vr_carrier.log.
# ===========================================================================

# Camera decomposition check: rebuild every main-pass view with the game's own
# camera instead of the HMD rewrite. Output must equal input — the
# "view/hmd:" log line reports identityResidMax ~1e-6 and decompFail=0.
# Changes rendering (no HMD camera).
# debug_view_identity=on

# GPU census ("gpu:" lines): per stereo pass and render-target category
# (main scene / 1024x4096 atlas / square targets / other / carrier blits):
# draw calls, CPU submission time and GPU time (timestamp queries). Adds
# draw-call hooks. Gameplay with the HMD.
# debug_gpu_census=on

# Pixel-shader census ("ps:" lines): one frame in 8, GPU time and pixels
# written (occlusion queries) per pixel shader, identified by a bytecode hash
# (tools/shader_hash.py maps hashes to the game's shader containers). Adds
# SetPixelShader + draw-call hooks. Gameplay with the HMD.
# debug_ps_census=on

# GUI census ("gui:" lines): every 30 s, one pass-1 frame from just before the
# first GUI (Scaleform) record to the end of the draw list: record fields,
# render commands, shader-constant uploads, and each record's draws with their
# targets and depth/blend states (docs/hud.md). Adds build and device hooks.
# Gameplay with the HMD.
# debug_gui_census=on
# clouds = the same view of the clouds pass's records, both eye passes of
# two consecutive frames (docs/view_rewrite.md).
# debug_gui_census=clouds

# Main-thread wait census ("waits:" lines): time and calls in the game's
# Sleep / SleepEx / WaitForSingleObject / QueryPerformanceCounter /
# timeGetTime imports with top callers, plus a per-frame phase split
# (gate | update | pass 1 | pass 2 | tail | outside FrameTick). Finds frame
# limiters and where the frame time goes. Gameplay with the HMD.
# debug_wait_census=on

# Scene -> draw-record build census ("build:" lines): thread + timing of
# RenderShell_BuildSceneRecords / PgPrimitive_PublishFrame, a one-shot task-order
# sequence, and records tallied by (emitter, sub-view, type) — finds the HUD
# emitters (docs/reverse_engineering/scene_record_build.md). Gameplay with the HMD.
# debug_build_census=on

# Camera-data census: logs, once per shader, the main-pass vertex shaders that
# take camera data from constants other than viewContextData (which the
# per-eye rewrite does not correct), and the pixel shaders with camera data
# (cameraPos, the PS viewContextData, *View*/*Proj*/*Mtx* constants), with each
# constant's source and, for the PS, its device-level writers.
# debug_camera_census=on
# Skip main-pass draws of vertex or pixel shaders with this constant (both
# eyes) to identify an artifact's draws; implies the census.
# debug_camera_census_skip=LocalToProj

# Cull probe ("cullprobe:" lines): which frustum plane of which frustum
# rejects objects, per caller of the engine's plane test, by camera pitch
# (docs/culling.md). Log-only. Gameplay with the HMD.
# debug_cull_probe=on

# Gameplay census ("gameplay:" lines; docs/first_person.md): frame phases,
# who runs the bone controllers (BodyBoneTracker OnPose / slot 2: caller,
# thread, frame phase), camera classes per g_CameraTable slot and the player's
# mode stack (logged on change), and the human camera's look input per 10 s.
# Play on foot, aim, fire, enter and leave a vehicle, sit through a cutscene.
# With debug_watch=player:13c it also feeds the watch the player object (the
# aim ray's readers = the fire site).
# debug_gameplay_census=on

# SecuROM VM chain reader: read-only dump of the chain behind the
# RenderTask_RenderFrame follow-up, re-read later to catch runtime patching
# ("vmdump:" lines; docs/reverse_engineering/vm_thunk_patches.md).
# debug_vm_dump=on

# Eye image pairs: after debug_dump_delay seconds, write N left/right BMP pairs
# (mc2vr_eye_left/right_frame<N>.bmp) of the final per-eye images. Only frames
# with real stereo content count (menus and loading screens are skipped).
# tools/analyze_dumps.py measures the shift between the eyes.
# debug_eye_dump_frames=5
# Seconds before the eye dump window opens (default 15).
# debug_dump_delay=15.0

# Hardware watchpoints (debug registers) on camera data: logs every accessing
# instruction, classified by region, aggregated every 10 s
# (docs/reverse_engineering/camera_data_flow.md).
#   debug_watch — '+'-separated targets, max 4:
#     staged camera block: stagingpos stagingserial stagingquat
#     view entry fields: slot0 slot0v slotdir slotparams near fov fovmid
#       fovsin dir670 posprev pos serial quat camdata flags808
#     or a raw address: addr:0x0116977c
#     or a player-object field: player:13c (aim direction), player:124 (aim
#       point) — needs debug_gameplay_census=on, which provides the address
#   debug_watch_view=N — view index to watch (default: picked automatically
#     after ~10 s of gameplay; indices differ between runs).
#   debug_watch_mode=full|write — reads and writes (default) or writes only.
#   debug_watch_hits=N — detailed lines per unique instruction (default 30).
# Under Wine the hit field can't be attributed with several targets — watch
# one target for exact attribution.
# debug_watch=stagingquat
# debug_watch_mode=full
# debug_watch_hits=30
