# mc2vr carrier configuration (read at DLL attach; restart the game to apply).
# Deployed to <GAME_DIR>/mc2vr/mc2vr.conf; launch.sh never overwrites an
# existing copy — edit the DEPLOYED file to change behavior.

# GPU-boundary rewrite (S1 window O — the S2 per-eye mechanism):
# rewrites world-position vertex-shader constant rows (w==1.0) INSIDE the
# SetVertexShaderConstantF upload, at the draw-consumption point. Never
# touches game state. Verified visible (S1 runs 16-17).
#   off   — normal instrumented behavior (patch-window sequence). DEFAULT.
#   on    — continuous constant shift (x += 4 on every matching row).
#   pulse — continuous ~2s sine drift — visual verification mode (disables
#           the patch-window machine; the rewrite is the only effect).
gpu_boundary_rewrite=off
