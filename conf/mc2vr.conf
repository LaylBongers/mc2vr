# mc2vr carrier configuration (read at DLL attach; restart the game to apply).
# Deployed to <GAME_DIR>/mc2vr/mc2vr.conf; launch.sh never overwrites an
# existing copy — edit the DEPLOYED file to change behavior.

# View rewrite — the camera channel (docs/stereo_design.md §S2): rewrites the
# technique's viewContextData registers inside the SetVertexShaderConstantF
# upload (camPos.xyz += D, each VP row w -= dot(row.xyz, D) = rigid camera
# pan), main scene pass only.
#   off    — pass-through.
#   on     — constant pan of +view_row_amp world units along +x.
#   pulse  — ~2s sine pan of +/-view_row_amp (visual verification mode).
#   stereo — per-eye offset D = ±right·view_ipd/2 along the camera right axis
#            (derived from the raw VP row0 uploads). The eye sign alternates
#            every view_stereo_hold seconds (A/B verification until the S2c
#            replay supplies real per-eye draw passes).
#   hmd    — S4-4: replace the whole VP block from the HMD pose (needs the
#            host + eye_pass/frame_replay/eye_share): game camera = body, HMD
#            pose = offset on it; projection rebuilt from the OpenXR FOV,
#            depth terms kept. Frames carry the pose id so the host submits
#            the layer with the rendered pose. See docs/stereo_design.md §S4-4.
#   hmd_identity — decompose + rebuild with the game's OWN camera; output must
#            equal input. Verify first: `view/hmd:` log line must show
#            identityResidMax ~1e-6 and decompFail=0 and the picture unchanged.
#   stereo is the CURRENT verification mode (handover step 1); flip back to
#   pulse/on if re-checking the basic pan.
view_row_rewrite=stereo

# Pan amplitude in world units for on/pulse (default 4.0 — intentionally
# unmistakable, clips through terrain). ~0.05 for game-scale checks; 0.032 =
# IPD scale.
# view_row_amp=0.05

# Full inter-pupillary distance in world units for stereo mode (default 0.065;
# the per-eye offset is half of this, ≈0.032).
# view_ipd=0.065

# Game world units per metre for hmd mode's head translation (default 1.0 —
# UNVERIFIED; measure e.g. via a known-size object, then set it).
# view_world_scale=1.0

# Seconds each eye is held before stereo mode alternates (default 2.0 — long
# enough to eyeball shadows/materials at each eye).
# view_stereo_hold=2.0

# Per-eye asymmetric-projection centre shift, NDC units (default 0 = disabled;
# row_k.w += |row_k.xyz|·shift·eyeSign — sign convention to be validated
# against the HMD runtime in S4).
# view_asym_x=0
# view_asym_y=0

# S2c-1: second draw pass (docs/stereo_design.md §S2). After each original
# PgPrimitive_SubmitToGPU the carrier invokes it a second time — the whole
# record walk re-runs from a cleared scene (Present prev / BeginScene /
# GPU-sync / Clear), same eye constants, same render targets. Unchanged output
# on screen proves the pass is state-safe; any visual regression = a state
# bug to fix before S2c-2 (per-eye). Costs roughly one extra frame of
# render time (watch the "S2c replay: avgMs" log line; vsync-locked 60 Hz may
# drop if the doubled submit exceeds the frame budget).
#   off — default.   on — second pass every frame.
frame_replay=on

# S2c-2: per-eye draw passes (docs/stereo_design.md §S2). All need frame_replay=on.
#   eye_pass — deterministic per-pass eye: pass 1 renders LEFT, pass 2 renders
#     RIGHT, every frame (replaces the view_stereo_hold A/B timer while
#     active; the hold timer still governs when frame_replay is off).
#   eye_rt — during pass 2, every device SetRenderTarget(0, mainRT) and
#     StretchRect source pointing at the main RT is redirected to a
#     carrier-created backbuffer-sized eye render target (device-level only;
#     the game's caches are untouched). Without the pin the two per-frame
#     EndSubmit copies alternate L/R on the monitor (rapid horizontal camera
#     oscillation = working temporal stereo).
#   eye_monitor_pin — keep a stable LEFT image on the monitor: the backbuffer
#     is snapshotted before pass 2 (pass 1's final image, composite+HUD) and
#     restored after it, so the game presents the same LEFT image at both
#     per-frame Presents. Backbuffer writes are NOT suppressed — SwapEffect=
#     DISCARD leaves a stale driver page when they are (live-observed
#     2026-10-04: frozen credits frame alternating with the live camera).
#     The S4 steady state: the OpenXR host will consume the eye images instead.
eye_pass=on
eye_rt=on
eye_monitor_pin=on

# S4-5 pacing: game-side vsync. Every frame has TWO Presents (present-prev at
# each pass's BeginSubmit — live-log-proven: ~600 Presents vs ~300 frames per
# 10s) and each blocks on a 60 Hz vsync slot, capping the game at ~30 Hz even
# though the render work itself is far cheaper (2008 engine, 2026 hardware).
#   on  — default; the game's own PresentationInterval is untouched.
#   off — the carrier hooks the game's Direct3DCreate9 thunk before boot and
#         forces D3DPRESENT_INTERVAL_IMMEDIATE in the CreateDevice params
#         (and again on every Reset). The game then runs as fast as the two
#         passes actually cost; the OpenXR host still paces the HMD at its own
#         cadence (runtime reprojection, S4-4 pose-id handoff). Watch the
#         "FrameTick: dt avg" report for the new cadence, and expect the
#         desktop window to tear (immediate present) — the HMD is unaffected.
# vsync=on

# S4-2: shared-handle image path to the OpenXR host (docs/stereo_design.md §S4).
#   on — at the pass boundaries the carrier blits the backbuffer (the per-eye
#   tonemapped LDR finals: 1->2 = LEFT, 2->0 = RIGHT, before the monitor-pin
#   restore) into a ring of shared-handle D3D9 textures and publishes
#   FRAME_READY over the IPC; the host mirrors the pair to a desktop window
#   (S4-2) ahead of OpenXR submission (S4-3). The shared-handle mechanism is
#   probe-proven cross-process under DXVK (tools/probe/run_shared_handle.sh).
#   Needs frame_replay=on (the two passes are the two eyes). Off by default:
#   flip on when a host is expected.
eye_share=off


# ===========================================================================
# Debug / diagnostics — every key here is prefixed debug_ and is OFF by default
# (commented out): these cost CPU, memory or disk. Uncomment to investigate. None
# change rendering behavior; they only observe, log and dump.
# ===========================================================================

# SecuROM-stub callback tracer (diagnostic; docs/reverse_engineering/render_path.md): brackets the
# opaque stub call at 0x004c99f9 and logs which plaintext helpers get called
# during it, with the caller's address/region. Plaintext hooks only.
#   off — default.   on — install the brackets + entry hooks.
# debug_stub_trace=on

# VM-chain live reader (diagnostic; docs/reverse_engineering/securom_vm.md): read-only dump of
# the SecuROM chain behind the RenderTask_RenderFrame follow-up (thunk
# 0x0046ab80 -> stub -> Stext handler -> VM entry), diffed against the on-disk
# image, re-read ~15s later to catch runtime patching. Logs "vmdump:" lines.
#   off — default.   on — run once at attach.
# debug_vm_dump=on

# S2c-0: render-command-stream capture + opcode census (read-only, zero behavior
# change; docs/stereo_design.md §S2). The M3 opcode MidHook inside
# RenderCmd_ExecuteStream walks and buffers each frame's command streams; the
# 10s report logs per-opcode counts (walk vs execution cross-check) and the
# first samples of each opcode payload are logged once per run ("S2c census").
#   off — default in code.   on — census in mc2vr_carrier.log.
# debug_stream_capture=on

# Raw stream dumps for offline analysis (requires debug_stream_capture=on): after
# debug_dump_delay seconds of capture, write mc2vr_stream_frame<N>.txt for
# debug_stream_dump_frames consecutive frames into this directory. Parse with
# tools/analyze_dumps.py. 0 = never dump.
# debug_stream_dump_frames=5
# debug_dump_delay=15.0

# Eye BMP pair dump (requires eye_pass=on):
# debug_eye_dump_frames: after debug_dump_delay seconds, write BMP pairs
#   (mc2vr_eye_left/right_frame<N>.bmp) for the parallax check — pairs
#   count only when NON-EMPTY (black loading/video frames are skipped and
#   retried at 0.5s cadence, so the window waits for real content). fp16
#   HDR targets (A16B16G16R16F) are decoded + Reinhard-tonemapped to
#   24-bit. tools/analyze_dumps.py reports the measured shift.
# debug_eye_dump_frames=5
