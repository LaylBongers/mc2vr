# mc2vr carrier configuration (read at DLL attach; restart the game to apply).
# Deployed to <GAME_DIR>/mc2vr/mc2vr.conf; launch.sh never overwrites an
# existing copy — edit the DEPLOYED file to change behavior.

# View rewrite — the per-eye camera channel at the GPU boundary
# (docs/view_rewrite.md, docs/camera.md). Rewrites the
# technique's viewContextData registers inside the SetVertexShaderConstantF
# upload, main scene pass only.
#   off         — pass-through.
#   hmd_delta   — I1: the per-eye complement to view_table_inject=on. The raw
#                 VP already carries the union HMD pose from the camera-table
#                 rewrite, so this mode applies ONLY the per-eye projection
#                 (OpenXR FOV — restores HMD aspect/FOV, replacing the game's
#                 widescreen projection) + the per-eye position delta (eye pose
#                 relative to the table's union pose). THE pairing with
#                 view_table_inject=on.
#   hmd_identity — decompose + rebuild with the game's OWN camera; output must
#                 equal input. Verify first: `view/hmd:` log line must show
#                 identityResidMax ~1e-6 and decompFail=0 and the picture
#                 unchanged. Also the clean pass-through channel for
#                 diagnostic probe runs (e.g. debug_camtable_probe).
#   (The old `hmd` full-VP-replacement mode and the early verification modes —
#    on/pulse/stereo row-shift pans — were REMOVED 2026-10-07: superseded by
#    view_table_inject + hmd_delta, live-verified.)
view_row_rewrite=hmd_delta

# Union HMD injection at g_CameraTable (docs/camera.md
# "Decided architecture", implemented 2026-10-07): a MidHook right after the
# per-frame camera-table fill (CameraTable_FillFromPose 0x0070ae50, copy end
# 0x0070aef8) rewrites each JUST-filled table entry's camera-to-world rotation
# and position with the game pose composed with the mid-eye (union) HMD pose.
# This is the single upstream point feeding BOTH the draw-camera builder and
# the culling/fov readers — so culling/LOD/shadows follow the head (the goal:
# no pop-in on head turn), and both same-spot draw views inherit the pose.
# Pair with view_row_rewrite=hmd_delta for the per-eye FOV/position delta.
#   off — default.   on — rewrite the table (needs the OpenXR host tracked).
# The composition is PROBE-DERIVED (2026-10-07, live-verified): the entry's
# ROWS are the rendered camera's axes and writes pass through the builder's
# matrix inverse, so the carrier writes E' = S_r·L⁻¹·S_r·E (see the plate on
# CameraTable_FillFromPose). A runtime row-sign calibration must lock first
# ("camtable: camera frame MEASURED" log line; until then the rewrite waits,
# counted as frameWaits in the window report).
# Verification oracles:
#   - "camtable: window" fills≈rewritten, noPose=0, frameWaits stops growing
#     after the MEASURED line;
#   - head rotation correct in all three axes through aim changes;
#   - culling pop-in on head turn (the acceptance test).
# view_table_inject=on

# Transfer-function probe (diagnostic; camera_table.cpp): injects a fixed
# +10° rotation about one camera-local axis at the fill site, cycling
# x→y→z every 2 seconds, and logs the pre/post entry plus the RENDERED
# result (decomposed from the uploads). Five symptom-triangulation rounds
# produced mutually inconsistent conventions — pure sign errors cannot
# produce the observed pitch/roll COUPLING, so the error is state-dependent
# and must be MEASURED. Run: get into gameplay, stand still (do not aim
# around), let it log ~15s; no HMD needed (pair with view_row_rewrite=
# hmd_identity for a clean pass-through channel). Send the camprobe: lines.
#   off — default.   on — probe active (overrides the union rewrite).
# debug_camtable_probe=on

# Game world units per metre for hmd_delta head translation (default 1.0 —
# VERIFIED 2026-10-07: units are metres; Havok world gravity is 9.8–9.81 game
# units/s^2 (docs/reverse_engineering/world_units.md), and
# the live eye-dump IPD check closed the end-to-end verification. Do not change
# without re-verifying).
# view_world_scale=1.0

# frame_replay: second draw pass (docs/stereo.md). After each original
# PgPrimitive_SubmitToGPU the carrier invokes it a second time — the whole
# record walk re-runs from a cleared scene (Present prev / BeginScene /
# GPU-sync / Clear), same eye constants, same render targets. Unchanged output
# on screen proves the pass is state-safe; any visual regression = a state
# bug to fix before per-eye replay. Costs roughly one extra frame of
# render time (watch the "stream replay: avgMs" log line; vsync-locked 60 Hz may
# drop if the doubled submit exceeds the frame budget).
#   off — default.   on — second pass every frame.
frame_replay=on

# Per-eye draw passes (docs/stereo.md). All need frame_replay=on.
#   eye_pass — deterministic per-pass eye: pass 1 renders LEFT, pass 2 renders
#     RIGHT, every frame (replaces the view_stereo_hold A/B timer while
#     active; the hold timer still governs when frame_replay is off).
#   The engine's final frame of each pass lands in the carrier-owned front
#   surface (always on — src/carrier/render_outputs.cpp); the monitor shows
#   the LEFT image (carrier mirror blitted into the swapchain before each
#   Present). (eye_rt / eye_monitor_pin / own_outputs were retired 2026-11-08.)
eye_pass=on

# Vsync pacing: game-side vsync. Every frame has TWO Presents (present-prev at
# each pass's BeginSubmit — live-log-proven: ~600 Presents vs ~300 frames per
# 10s) and each blocks on a 60 Hz vsync slot, capping the game at ~30 Hz even
# though the render work itself is far cheaper (2008 engine, 2026 hardware).
#   on  — default; the game's own PresentationInterval is untouched.
#   off — the carrier hooks the game's Direct3DCreate9 thunk before boot and
#         forces D3DPRESENT_INTERVAL_IMMEDIATE in the CreateDevice params
#         (and again on every Reset). The game then runs as fast as the two
#         passes actually cost; the OpenXR host still paces the HMD at its own
#         cadence (runtime reprojection, pose-id handoff). Watch the
#         "FrameTick: dt avg" report for the new cadence, and expect the
#         desktop window to tear (immediate present) — the HMD is unaffected.
# vsync=on

# Render size (docs/render_resolution.md, src/carrier/render_size.cpp): the
# engine's render chain, the per-eye passes and the carrier outputs run at
# W×H while the window/swapchain stay at the game's own resolution (the
# monitor shows the LEFT eye aspect-fit). Set it to the HMD's per-eye size
# (mc2vr_host.log: "openxr: eye 0 swapchain WxH").
#   off — default (render size = window size).   WxH — e.g. 2016x2240.
# render_size=2016x2240
# render_size applies only while the HMD is in use (host session
# VISIBLE/FOCUSED + tracked, 1 s debounce); with the HMD on standby (or no host)
# the game renders at window size exactly as unmodded — mouse included. Each
# switch is a device reset through the engine's own device-lost recovery.
#   on — default.   off — render_size always.
# render_size_follow_hmd=on
# Aspect fed to the engine's camera/UI when render_size is set:
#   true — default: the real W/H ratio.   snap — the engine's own 4:3/16:9 snap.
# render_aspect=true

# Shared-handle image path to the OpenXR host (docs/shared_textures.md).
#   on — at the pass boundaries the carrier blits its front surface (the
#   per-eye tonemapped LDR finals: 1->2 = LEFT, 2->0 = RIGHT) into a ring of
#   shared-handle D3D9 textures and publishes
#   FRAME_READY over the IPC; the host mirrors the pair to a desktop window
#   ahead of OpenXR submission. The shared-handle mechanism is
#   probe-proven cross-process under DXVK (tools/probe/run_shared_handle.sh).
#   Needs frame_replay=on (the two passes are the two eyes). Off by default:
#   flip on when a host is expected.
eye_share=off

# ---------------------------------------------------------------------------
# HMD cull frustum (docs/culling.md)
# ---------------------------------------------------------------------------
# view_table_inject makes culling follow the head; this makes it cover the
# HMD's FOV. A MidHook in the view-context builder (0x0085943B) replaces the
# frustum half-extents (tanH/tanV) of HMD-driven views with the HMD FOV
# union + cull_fov_margin — every frustum product (projection, cull planes,
# shadow cascades) derives from those two values. Shadow/reflection views are
# untouched. The game's own (invisible under hmd_delta) projection widens
# with it: `view: gameproj` then reports the HMD angles. The third-person
# camera's obstacle clearance (read from the near plane, 0x007107F9) is kept
# at the game's own extents, or the camera would pull in near obstacles.
# Needs view_table_inject=on and a tracked HMD. LIVE-VERIFIED 2026-10-08.
# Oracle: "cullfov: window" — widened > 0, "game 36.7°/22.7° -> cull ..",
# camClear restored > 0 with stock ~0.
#   off — default.   on — cull against the HMD frustum (the VR setting).
# cull_hmd_fov=on
# Degrees added to each HMD half-angle (default 5, range 0-30).
# cull_fov_margin=5.0

# Occluder boxes (docs/culling.md "VR smearing"): the engine emits an
# 'OcclusionMaterial' unit box per flagged object (calls at 0x00468eed /
# 0x00468f12). In the two-pass VR render that leaves undrawn regions (stale
# pixels) at fixed world seams; skipping the boxes removes the smearing
# (live-verified 2026-10-09). Default on; off restores the stock behavior.
# skip_occluder_boxes=on

# ===========================================================================
# Debug / diagnostics — every key here is prefixed debug_ and is OFF by default
# (commented out): these cost CPU, memory or disk. Uncomment to investigate. None
# change rendering behavior; they only observe, log and dump.
# ===========================================================================

# Render-target / render-size probe (diagnostic; docs/render_resolution.md
# track 2, src/carrier/debug/rt_probe.cpp). Log-only "rtprobe:" lines:
# render target table snapshots (+ depth mode g_LtiRenderer+0x594), who binds
# the backbuffer per pass (stack signatures), the DEFAULT-pool creation census,
# device getter callers, and the OnScreenResize / SetupRenderTargets order.
# Run: gameplay ~10s, menus + a loading screen, a resolution change and back.
# No HMD needed.
#   off — default.   on — install the probe hooks.
# debug_rt_probe=on

# SecuROM-stub callback tracer (diagnostic; docs/reverse_engineering/vm_stub_callbacks.md): brackets the
# opaque stub call at 0x004c99f9 and logs which plaintext helpers get called
# during it, with the caller's address/region. Plaintext hooks only.
#   off — default.   on — install the brackets + entry hooks.
# debug_stub_trace=on

# VM-chain live reader (diagnostic; docs/reverse_engineering/vm_thunk_patches.md): read-only dump of
# the SecuROM chain behind the RenderTask_RenderFrame follow-up (thunk
# 0x0046ab80 -> stub -> Stext handler -> VM entry), diffed against the on-disk
# image, re-read ~15s later to catch runtime patching. Logs "vmdump:" lines.
#   off — default.   on — run once at attach.
# debug_vm_dump=on

# Stream capture + opcode census (read-only, zero behavior
# change; docs/stereo.md). The opcode MidHook inside
# RenderCmd_ExecuteStream walks and buffers each frame's command streams; the
# 10s report logs per-opcode counts (walk vs execution cross-check) and the
# first samples of each opcode payload are logged once per run ("stream census").
#   off — default in code.   on — census in mc2vr_carrier.log.
# debug_stream_capture=on

# Raw stream dumps for offline analysis (requires debug_stream_capture=on): after
# debug_dump_delay seconds of capture, write mc2vr_stream_frame<N>.txt for
# debug_stream_dump_frames consecutive frames into this directory. Parse with
# tools/analyze_dumps.py. 0 = never dump.
# debug_stream_dump_frames=5
# debug_dump_delay=15.0

# Eye BMP pair dump (requires eye_pass=on):
# debug_eye_dump_frames: after debug_dump_delay seconds, write BMP pairs
#   (mc2vr_eye_left/right_frame<N>.bmp) for the parallax check — pairs
#   count only when NON-EMPTY and the per-eye camera rewrite ran in BOTH
#   passes (menus / pre-HMD-lock frames are identical by construction); others
#   are skipped and retried at 0.5s cadence, so the window waits for real
#   stereo content. The
#   pairs are the per-eye LDR finals (composite + HUD; the HUD sits at the
#   same screen position in both eyes). tools/analyze_dumps.py reports the
#   measured shift.
# debug_eye_dump_frames=5

# Culling RE: hardware watchpoints (debug registers) on the ViewEntry
# camera fields or the STAGED camera block — logs every accessor's EIP with
# region classification (text vs SecuROM VM sections vs carrier-self),
# aggregated per 10s window. One run answers: are the writers plaintext or
# VM, and WHO READS the camera data (the culling consumer). See
# docs/reverse_engineering/camera_data_flow.md.
#   debug_watch — '+'-separated targets, max 4 (DR0-3):
#     staged camera block (the VM consumer's input, direct culler probe):
#       stagingpos stagingserial stagingquat
#     ViewEntry fields of the chosen view: slot0 slot0v slotdir slotparams
#     near fov fovmid fovsin dir670 posprev pos serial quat camdata flags808
#     — or raw addresses "addr:0x0116977c" (watch any VA, e.g. a
#     g_ViewContextTable record's VP rows once identified).
#   debug_watch_view=N — view index to watch (default: automatic — the
#     MOST-WALKED view whose companion liveness byte is 01 after a 10s settle;
#     loading templates (00) and transient views lose). Check the "watch:"
#     chose/live lines. View indices are NOT stable across runs — pin only
#     with an idx logged in THAT run.
#   debug_watch_mode=full|write — full (default) catches reads AND writes
#     (the culling consumer); write = writes only.
#   debug_watch_hits=N — per-unique-EIP detail lines with surrounding code
#     bytes (default 30); window reports aggregate all unique EIPs.
# Caveats: arming waits for view selection (~10s into gameplay); threads
# created after the one-time arm are not watched; each window verifies the
# DRs and logs clobbering. Under Wine per-field attribution is unavailable
# (Dr6 is not delivered with the trap) — run a SINGLE target for exact
# attribution (hits show field "?" otherwise).
# Suggested next runs (one target each, in order):
#   debug_watch=stagingquat   — who relays the staged camera (registers now logged)
#   DONE 2026-10-06: quat, pos, full sweep, fov, slot0 — the culling-input
#   chain is fully identified (plaintext, change-gated, culminating in
#   ViewEntry_DeriveCullTask 0x00876a90); see
#   docs/reverse_engineering/camera_data_flow.md.
#   DONE 2026-10-06 (E1/E1b): g_ViewContextTable record row0 + the fill-source
#   scratch 0x017D04E0 — the full draw-camera constant chain is mapped (records
#   are PLAINTEXT-filled, once per frame; VP built by
#   ViewContext_BuildCameraConstants 0x008591ac, VM-called via thunk 0x00506a26);
#   see docs/reverse_engineering/draw_camera_chain.md and
#   docs/camera.md E1 RESULT.
# debug_watch=stagingquat
# debug_watch_mode=full
# debug_watch_hits=30
